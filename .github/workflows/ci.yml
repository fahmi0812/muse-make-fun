name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests (tools/mf.mjs)
        run: node --test tools/mf.test.mjs
      - name: Shellcheck
        run: shellcheck setup/setup.sh tools/*.sh
      - name: Validate JSON
        run: node -e 'JSON.parse(require("fs").readFileSync("setup/mcp.json","utf8"))'
      - name: Pinned files match VERSION
        run: |
          v="$(tr -d '[:space:]' < VERSION)"
          test -f "references/skill-upstream-v$v.md"
          test -f "references/heartbeat-v$v.md"
          grep -q "^version: \"$v\"" "references/skill-upstream-v$v.md"
          head -1 SKILL.md | grep -q '^---$'
      - name: Setup installs cleanly and leaves the checkout untouched
        run: |
          HOME="$RUNNER_TEMP/home" AGENT=claude-code bash setup/setup.sh
          test -f "$RUNNER_TEMP/home/.claude/skills/make-fun/SKILL.md"
          test -f "$RUNNER_TEMP/home/.claude/skills/make-fun/tools/mf.mjs"
          test -z "$(git status --porcelain)"
